[project]
name = "csi-project-be"
version = "0.1.0"
description = "CSI Youth Movement API"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.17.2",
    "bcrypt>=4.1.0",
    "boto3>=1.34.0",
    "email-validator>=2.3.0",
    "fastapi>=0.109.2",
    "httpx>=0.27.0",
    "openpyxl>=3.1.5",
    "phonenumbers>=9.0.0",
    "psycopg[binary]>=3.3.2",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.12.0",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.20",
    "redis>=5.0.0",
    "sqlalchemy>=2.0.44",
    "uvicorn[standard]>=0.38.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
